<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="trutools">
  <title>trutools</title>

  <rect width="32" height="32" rx="7" fill="#000000" />

  <!--
    lucide "terminal", the same mark as the navbar wordmark. 24x24 at stroke
    width 2, scaled to 22px with a 5px margin. Stroke bumped to 2.5 so the
    prompt still reads when the icon is drawn at 16px in a tab.
  -->
  <g
    transform="translate(5 5) scale(0.9166667)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m4 17 6-6-6-6" />
    <path d="M12 19h8" />
  </g>
</svg>
